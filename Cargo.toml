[workspace]
resolver = "3"
members = ["crates/koala", "crates/koala-capture", "crates/koala-diagnostics", "crates/koala-msi", "crates/koala-pairing", "crates/koala-rapport", "crates/koala-vcam", "crates/koala-vcam-source"]
# Warlock's crates belong to Warlock's own workspace, not this one.
exclude = ["third_party/warlock"]

[workspace.package]
# Koala's one version, which every crate carries: semver, with 0.y.z read as
# y for breaking changes, as in Warlock.
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Parker Wahle <regulad@regulad.xyz>"]

# Every dependency was released at least two weeks before it was added
# (PLAN.md, "Pinned decisions"); Cargo.lock pins transitive ones that weren't.
[workspace.dependencies]
koala-capture = { path = "crates/koala-capture", version = "0.0.0" }
koala-diagnostics = { path = "crates/koala-diagnostics", version = "0.0.0" }
koala-pairing = { path = "crates/koala-pairing", version = "0.0.0" }
koala-rapport = { path = "crates/koala-rapport", version = "0.0.0" }
koala-vcam = { path = "crates/koala-vcam", version = "0.0.0" }
# Warlock's API client (GPL-2.0-only OR AGPL-3.0-or-later; Koala takes it
# under the AGPL), from the Warlock submodule, which is pinned to a release
# (`git submodule update --init`; Warlock's own submodules aren't needed).
warlock-client = { path = "third_party/warlock/crates/warlock-client", version = "0.2.0" }
# Warlock's MSI builder's machinery (GPL-2.0-only OR AGPL-3.0-or-later; Koala
# takes it under the AGPL), which koala-msi builds Koala's package with.
warlock-msi-kit = { path = "third_party/warlock/crates/warlock-msi-kit", version = "0.2.5" }

aes = "0.9.4"
apple-opack = "1.1.0"
chacha20poly1305 = "0.11.0"
ctr = "0.10.1"
ed25519-dalek = "3.0.0"
# FFmpeg (tools/ffmpeg.ps1 fetches the build it links): libavformat writes
# the camera's recordings. Its ffmpeg-sys-next is held at 9.0.1 in
# Cargo.lock: 9.1 is too new.
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["format"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
opus = "0.4.0"
# opus's libopus build. Pinned: PLAN.md, avc-media.
opusic-sys = "=0.7.6"
miniz_oxide = "0.9.1"
plist = "1.10.3"
qrcode = { version = "0.14.1", default-features = false }
# The diagnostics' redaction (crates/koala/src/diagnostics.rs).
regex-lite = "0.1.9"
# Diagnostics (PRIVACY.md; PLAN.md, "Diagnostics"): Sentry's SDK (MIT),
# without its defaults' logs and metrics, sending over reqwest with Windows'
# own TLS and certificate store (SChannel, through native-tls). Not ureq: its
# native-tls feature bundles Mozilla's roots (webpki-root-certs, under
# CDLA-Permissive-2.0, which deny.toml doesn't allow). Pinned: 0.49.6 is too
# new.
sentry = { version = "=0.49.5", default-features = false, features = ["backtrace", "contexts", "panic", "release-health", "debug-images", "reqwest", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
srp = "0.7.0-rc.3"
thiserror = "2.0.21"
# The microphones' USB devices, served over USB/IP to usbip-win2 (PLAN.md,
# "Audio out"): network-audio's (MIT), which isn't on crates.io, at its
# commit of 2026-11-07.
usbip-audio = { git = "https://github.com/network-audio/usbip-audio", rev = "58032ab0664ffec1d0c178f40a3a69359c21f597", version = "0.1.0" }
tokio = "1.54.1"
# TCP keepalive on the capture session's connection, which tokio doesn't
# set (MIT OR Apache-2.0; tokio's own, already in Cargo.lock; 13 July 2026).
socket2 = "0.6.5"
windows = "0.62.2"
# windows' COM support, for implementing interfaces (koala-vcam).
windows-core = "0.62.2"
# WinUI 3 for koala-tray (PLAN.md, "UI"): windows-rs's Reactor, a preview.
# From master at a commit at least two weeks old: its last release
# (0.100.0, 2026-09-03) has no notification icon. Needs the Windows App
# Runtime 2.6 installed.
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "a344513ba514df30dc784f6969515302d5b011e6", version = "0.101.0" }
windows-sys = "0.61.2"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

# Line tables in the release PDBs, which a tag's build uploads to Sentry, so
# that a crash's frames name their files and lines (PLAN.md, "Diagnostics").
# They don't change the code.
[profile.release]
debug = "line-tables-only"
