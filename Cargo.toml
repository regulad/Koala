[workspace]
resolver = "3"
members = ["crates/koala", "crates/koala-capture", "crates/koala-pairing", "crates/koala-rapport"]

[workspace.package]
# Koala's one version, which every crate carries: semver, with 0.y.z read as
# y for breaking changes, as in Warlock.
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Parker Wahle <regulad@regulad.xyz>"]

# Every dependency was released at least two weeks before it was added
# (PLAN.md, "Pinned decisions"); Cargo.lock pins transitive ones that weren't.
[workspace.dependencies]
koala-capture = { path = "crates/koala-capture", version = "0.0.0" }
koala-pairing = { path = "crates/koala-pairing", version = "0.0.0" }
koala-rapport = { path = "crates/koala-rapport", version = "0.0.0" }
# Warlock's API client (GPL-2.0-only OR AGPL-3.0-or-later; Koala takes it
# under the AGPL), from a Warlock checkout beside this one. Not from git yet:
# Cargo fetches a git dependency's submodules recursively, and devourer pins
# a reference submodule (reference/rtl8852cu) to a commit that no longer
# exists. regulad/Koala#2 tracks it (through regulad/Warlock#14 and
# OpenIPC/devourer#586).
warlock-client = { path = "../Warlock/crates/warlock-client", version = "0.2.0" }

aes = "0.9.4"
apple-opack = "1.1.0"
chacha20poly1305 = "0.11.0"
ctr = "0.10.1"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
opus = "0.4.0"
# opus's libopus build. Pinned: PLAN.md, avc-media.
opusic-sys = "=0.7.6"
miniz_oxide = "0.9.1"
plist = "1.10.3"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
srp = "0.7.0-rc.3"
thiserror = "2.0.21"
tokio = "1.54.1"
windows = "0.62.2"
# WinUI 3 for koala-tray (PLAN.md, "UI"): windows-rs's Reactor, a preview.
# From master at a commit at least two weeks old: its last release
# (0.100.0, 2026-09-03) has no notification icon. Needs the Windows App
# Runtime 2.6 installed.
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "a344513ba514df30dc784f6969515302d5b011e6", version = "0.101.0" }
windows-sys = "0.61.2"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
