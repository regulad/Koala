[package]
name = "koala"
description = "An iPhone as a Windows microphone"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
apple-opack.workspace = true
ffmpeg-next.workspace = true
getrandom.workspace = true
koala-capture.workspace = true
koala-diagnostics.workspace = true
koala-pairing.workspace = true
koala-rapport.workspace = true
koala-vcam.workspace = true
opus.workspace = true
# Not used directly: pins opus's libopus build (PLAN.md, avc-media).
opusic-sys.workspace = true
qrcode.workspace = true
sentry.workspace = true
socket2.workspace = true
tokio ={ workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
usbip-audio.workspace = true
warlock-client.workspace = true
windows-reactor.workspace = true
windows = { workspace = true, features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Display",
    "Foundation",
    "Foundation_Collections",
    "Graphics",
    "Storage_Streams",
    # The camera's decoding (src/decode.rs).
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_Dns",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# The diagnostics' test sends through the SDK to a test transport.
sentry = { workspace = true, features = ["test"] }
