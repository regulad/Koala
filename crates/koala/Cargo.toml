[package]
name = "koala"
description = "An iPhone as a Windows microphone"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
apple-opack.workspace = true
getrandom.workspace = true
koala-capture.workspace = true
koala-pairing.workspace = true
koala-rapport.workspace = true
opus.workspace = true
# Not used directly: pins opus's libopus build (PLAN.md, avc-media).
opusic-sys.workspace = true
qrcode.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
warlock-client.workspace = true
windows = { workspace = true, features = ["Devices_Bluetooth", "Devices_Bluetooth_Advertisement", "Foundation", "Foundation_Collections", "Storage_Streams"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_NetworkManagement_Dns", "Win32_System_Diagnostics_Etw", "Win32_System_Time"] }
