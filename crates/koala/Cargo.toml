[package]
name = "koala"
description = "An iPhone as a Windows microphone"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
apple-opack.workspace = true
getrandom.workspace = true
koala-capture.workspace = true
koala-pairing.workspace = true
koala-rapport.workspace = true
opus.workspace = true
# Not used directly: pins opus's libopus build (PLAN.md, avc-media).
opusic-sys.workspace = true
qrcode.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
warlock-client.workspace = true
windows-reactor.workspace = true
windows = { workspace = true, features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Display",
    "Foundation",
    "Foundation_Collections",
    "Graphics",
    "Storage_Streams",
] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_Dns",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
