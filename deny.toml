# cargo-deny (`cargo deny check`, run by pre-commit): what Koala may depend
# on. Koala is AGPL-3.0-or-later, so every dependency must be compatible
# with the AGPLv3 (PLAN.md, "Licensing").

[graph]
# Every feature, so optional dependencies are checked too.
all-features = true

[advisories]
ignore = []

[licenses]
# Unlike Warlock (GPL-2.0-only), Koala can take Apache-2.0: it's compatible
# with (A)GPLv3. GPL-2.0-only is left out: it can't be combined with the
# AGPLv3. warlock-client is "GPL-2.0-only OR AGPL-3.0-or-later", taken here
# under the AGPL.
allow = [
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    # ffmpeg-next and ffmpeg-sys-next: as permissive as MIT, and as
    # compatible (Parker, 2026-11-20).
    "WTFPL",
    "Zlib",
]
confidence-threshold = 0.93
# The list is policy, not an inventory: allowed licences nothing uses yet are fine.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "bincode", reason = "its 3.0 release is a tombstone; use postcard" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Warlock's client crate comes from its repository; windows-reactor, a
# preview, from windows-rs's (Cargo.toml).
allow-git = ["https://github.com/regulad/Warlock", "https://github.com/microsoft/windows-rs"]
