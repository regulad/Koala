name: Dependabot auto-merge

# Turns on GitHub's auto-merge for Dependabot's pull requests that aren't
# major updates, GitHub Actions updates or pre-commit hook updates: today
# that leaves the security updates. GitHub then merges each one once Check's
# required check passes (.github/settings.yml). Nothing deploys from master:
# a release is a tag, by hand (build.yml). As Warlock's
# dependabot-auto-merge.yml does.
#
# Any update but those merges, rather than only named groups, so that
# security updates do too. They come outside the groups, and skip the
# cooldown: Check, cargo-deny's licence zone among its hooks, is what they
# pass before merging. These wait for a person:
# - every GitHub Actions update, grouped or not, since none of the actions
#   promises SemVer;
# - every pre-commit hook update, since none of the hook projects promises
#   SemVer, so a minor or patch release may still change what a hook does;
# - major updates.
#
# Auto-merge is turned on with the DEPENDABOT_MERGE_TOKEN secret, not
# GITHUB_TOKEN. GitHub credits the merge to whoever turned auto-merge on,
# and starts no workflows for a push credited to GITHUB_TOKEN, so the merge's
# push to master wouldn't run Check, which saves the cache the other runs
# read. The token is a fine-grained personal access token for this
# repository only, with read and write access to Contents and Pull requests.
# It has no access to workflows, so it couldn't merge the GitHub Actions
# updates even by mistake. It's a Dependabot secret because runs started by
# Dependabot can only read Dependabot secrets.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    # Only for Dependabot's own pushes. A person who pushes to its pull
    # request (to fix the lockfile, say) takes the pull request over and
    # merges it themselves; their push's run can't read Dependabot secrets in
    # any case.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # gh pr merge --auto merges at once when the branch requires no checks, so a lost branch protection would turn
      # this into merging every update unchecked. Refuse instead. The branch endpoint shows the required checks to the
      # workflow's own token.
      - name: Refuse unless the branch requires checks
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          required=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${BASE}" --jq '.protection.required_status_checks.contexts | length')
          if [ "${required}" -eq 0 ]; then
            echo "::error::${BASE} requires no status checks, so auto-merge would merge this pull request unchecked. Restore the protection .github/settings.yml declares."
            exit 1
          fi
      # fetch-metadata names the ecosystem as Dependabot's branch does
      # (dependabot/<ecosystem>/...): github_actions, pre_commit.
      - name: Merge once Check passes
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major'
          && steps.metadata.outputs.package-ecosystem != 'github_actions'
          && steps.metadata.outputs.package-ecosystem != 'pre_commit'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_MERGE_TOKEN }}
