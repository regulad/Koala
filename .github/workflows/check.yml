# Checks every pull request, Dependabot's among them, and every push to
# master: the pre-commit hooks a commit runs (.pre-commit-config.yaml), over
# the whole tree, then the tests. Among the hooks, cargo-deny holds every
# dependency to the licence zone (deny.toml). As Warlock's check.yml does.
#
# Koala builds against Warlock's client crate from the Warlock submodule
# (Cargo.toml), so it's checked out too; Warlock's own submodules aren't.
name: Check

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Hooks and tests
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PRE_COMMIT_VERSION: 4.7.0
      # windows-reactor comes from windows-rs's repository, whose history is
      # over 3 GB: git's own fetch is much faster than Cargo's built-in one.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # ffmpeg-sys-next generates its bindings with bindgen, which loads
      # libclang: the runner's LLVM has it.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      # The tree is LF throughout; Windows runners would check it out CRLF.
      - name: Line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      # Cargo's downloads and the dependencies' object files, from master's
      # last run (Swatinem/rust-cache, pinned by its commit). Only a push to
      # master saves it: pull requests read it, and so do build.yml's jobs,
      # which never save. One key for all of them (`shared-key`); the key takes
      # the CARGO* and RUST* variables in the job's environment. The
      # workspace's own crates aren't cached (no `cache-workspace-crates`): a
      # checkout makes their files newer than any cached build, so Cargo
      # rebuilds them anyway, and setting the files' times back can have it
      # test stale code (PLAN.md, "Pipeline").
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: koala
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # The FFmpeg Koala links, pinned by its SHA-256 (tools/ffmpeg.ps1).
      - name: FFmpeg
        shell: pwsh
        run: ./tools/ffmpeg.ps1
      # pre-commit's hook environments, cargo-deny's build among them, keyed
      # on the hooks' revisions (.pre-commit-config.yaml).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit
        run: python -m pip install "pre-commit==$env:PRE_COMMIT_VERSION"
      - name: Hooks
        run: python -m pre_commit run --all-files --show-diff-on-failure
      - name: Tests
        run: cargo test --workspace --locked
