# Dependabot keeps Koala's dependencies current, weekly, as Warlock's does:
#   * the Rust workspace (Cargo.toml, Cargo.lock), Warlock's crates among
#     them: they're pinned to a release's commit, which Dependabot moves to
#     the newest release tag's;
#   * the GitHub Actions in .github/workflows/;
#   * the pre-commit hooks' revisions (.pre-commit-config.yaml).
#
# Each ecosystem gets one PR a week, on Monday morning, grouping its
# updates. workflows/dependabot-auto-merge.yml has GitHub merge every update
# but a major one once Check passes, security updates included. These wait
# for a person:
# - the sentry group: an update to Sentry's SDK is checked for what it adds
#   to the diagnostics before it ships (AGENTS.md);
# - the github-actions group, since none of the actions promises SemVer;
# - the pre-commit group, since none of the hook projects promises SemVer;
# - major updates.
#
# An update waits until its release is two weeks old (`cooldown`), as
# PLAN.md asks of every new dependency. Security updates don't wait: the
# cooldown doesn't apply to them, and they merge once Check passes, like
# the rest.
#
# Dependabot's pull requests run .github/workflows/check.yml: the
# pre-commit hooks, whose cargo-deny holds them to the licence zone, and
# the tests. Its label is in .github/settings.yml, which deletes labels it
# doesn't list.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/New_York
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      # Sentry's SDK, apart from the rest so that the rest can merge without
      # it. The cargo group excludes it by the same patterns.
      sentry:
        patterns: ["sentry", "sentry-*"]
        update-types: [minor, patch]
      # Minor and patch updates together; each major on its own.
      cargo:
        patterns: ["*"]
        exclude-patterns: ["sentry", "sentry-*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/New_York
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/New_York
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      pre-commit:
        patterns: ["*"]
