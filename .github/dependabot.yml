# Dependabot keeps Koala's dependencies current, weekly, as Warlock's does:
#   * the GitHub Actions in .github/workflows/;
#   * the pre-commit hooks' revisions (.pre-commit-config.yaml).
#
# Not the Rust workspace: warlock-client comes from a path in the Warlock
# submodule (Cargo.toml), and Dependabot's Cargo updates can't resolve a
# path into a submodule (dependabot/dependabot-core#11861). Its security
# alerts read Cargo.lock and still cover the Rust dependencies
# (settings.yml). Nor the submodule itself: Dependabot would move it to
# Warlock's latest commit, and Koala takes Warlock's releases, by hand.
#
# An update waits until its release is two weeks old (`cooldown`), as
# PLAN.md asks of every new dependency. Security updates don't wait: the
# cooldown doesn't apply to them, so review those with care.
#
# Dependabot's pull requests run .github/workflows/check.yml: the
# pre-commit hooks, whose cargo-deny holds them to the licence zone, and
# the tests. Its label is in .github/settings.yml, which deletes labels it
# doesn't list.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      pre-commit:
        patterns: ["*"]
