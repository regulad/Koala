# Repository configuration, managed by the Settings app
# (https://github.com/repository-settings/app). The shared defaults come from
# regulad/.github; this file sets only what is this repository's own.
_extends: .github

repository:
  name: Koala
  description: >-
    An iPhone as a microphone for Windows, with no app on the iPhone
  homepage: ""
  # Public: winget will download Koala's installer from a public release.
  private: false
  # Topics: comma-and-space separated string, NOT a YAML list.
  topics: iphone, microphone, continuity-camera, awdl, windows, rust, winui, reverse-engineering
  default_branch: master

  archived: false
  is_template: false

# No `environments` key, on purpose: the deployment environments (`release`,
# `testing`) and their signing secrets are managed by Parker's homelab
# configuration, not here. Don't add one: the Settings app would then
# delete every environment it doesn't list, secrets and all. Without the
# key it never touches them.
